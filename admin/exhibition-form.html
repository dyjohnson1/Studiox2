<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibition — XHS Admin</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<div class="admin-bar" id="adminBar"></div>

<div class="wrap">
  <div class="page-eyebrow">Exhibitions</div>
  <h1 class="page-title" id="pageTitle">Add Exhibition</h1>
  <p class="page-sub">Where the work has been shown, and where it is going.</p>

  <div class="msg" id="msg"></div>

  <form id="exhForm" class="card">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" required>
    </div>

    <div class="row">
      <div class="field">
        <label for="venue">Venue</label>
        <input type="text" id="venue" placeholder="Studio Museum adjacent project space">
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="New York">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="dateLabel">Date Label</label>
        <input type="text" id="dateLabel" placeholder="Mar — May 2026">
        <div class="hint">Free text exactly as it should appear (e.g. “Sep 2026”, “2025”).</div>
      </div>
      <div class="field" style="max-width:160px;">
        <label for="year">Year</label>
        <select id="year"></select>
        <div class="hint">Drives the year filter.</div>
      </div>
    </div>

    <div class="field">
      <label>Status</label>
      <div class="radios" id="status">
        <label><input type="radio" name="status" value="current"> Current</label>
        <label><input type="radio" name="status" value="upcoming"> Upcoming</label>
        <label><input type="radio" name="status" value="past" checked> Past</label>
      </div>
    </div>

    <div class="field">
      <label>Image</label>
      <div class="img-slots" style="grid-template-columns:1fr;max-width:420px;">
        <div class="img-slot" id="imgSlot" style="aspect-ratio:4/3;"><div class="slot-empty">No image</div></div>
      </div>
      <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp" style="margin-top:12px;">
      <div class="uploading" id="imgStatus"></div>
    </div>

    <div class="actions">
      <button type="submit" class="btn" id="saveBtn">Save Exhibition</button>
      <a class="btn secondary" href="/admin/dashboard.html">Cancel</a>
    </div>
  </form>
</div>

<script src="/admin/assets/admin.js"></script>
<script>
  const { API, requireSession, renderBar, showMsg, escapeHtml, qs } = window.Admin;
  const editId = qs('id');
  let image = null;

  (async function init() {
    const user = await requireSession();
    if (!user) return;
    renderBar('exhibitions', user);
    populateYears();
    wireUpload();
    if (editId) await loadExisting();
    document.getElementById('exhForm').addEventListener('submit', save);
  })();

  function populateYears() {
    const sel = document.getElementById('year');
    let opts = '<option value="">—</option>';
    for (let y = 2030; y >= 1990; y--) opts += '<option value="' + y + '">' + y + '</option>';
    sel.innerHTML = opts;
  }

  function renderImg() {
    const slot = document.getElementById('imgSlot');
    if (image) {
      slot.innerHTML = '<img src="' + escapeHtml(image) + '" alt="">' +
        '<div class="slot-tools"><span>Image</span><button type="button" id="rm">Remove</button></div>';
      slot.querySelector('#rm').addEventListener('click', () => { image = null; renderImg(); });
    } else { slot.innerHTML = '<div class="slot-empty">No image</div>'; }
  }

  function wireUpload() {
    document.getElementById('imgFile').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const status = document.getElementById('imgStatus'); status.textContent = 'Uploading…';
      try {
        const fd = new FormData(); fd.append('image', file);
        const res = await API.upload('/api/upload', fd);
        image = res.path; renderImg(); status.textContent = '';
      } catch (err) { status.textContent = ''; showMsg(err.message, 'error'); }
      e.target.value = '';
    });
  }

  async function loadExisting() {
    try {
      const { exhibition: x } = await API.get('/api/exhibitions/' + editId);
      document.getElementById('pageTitle').textContent = 'Edit Exhibition';
      document.getElementById('title').value = x.title || '';
      document.getElementById('venue').value = x.venue || '';
      document.getElementById('location').value = x.location || '';
      document.getElementById('dateLabel').value = x.dateLabel || '';
      document.getElementById('year').value = x.year || '';
      const r = document.querySelector('#status input[value="' + (x.status || 'past') + '"]');
      if (r) r.checked = true;
      image = x.image || null; renderImg();
    } catch (e) { showMsg('Could not load exhibition: ' + e.message, 'error'); }
  }

  async function save(e) {
    e.preventDefault();
    const status = document.querySelector('#status input:checked');
    const payload = {
      title: document.getElementById('title').value.trim(),
      venue: document.getElementById('venue').value.trim(),
      location: document.getElementById('location').value.trim(),
      dateLabel: document.getElementById('dateLabel').value.trim(),
      year: document.getElementById('year').value || null,
      status: status ? status.value : 'past',
      image: image,
    };
    if (!payload.title) return showMsg('Title is required.', 'error');
    try {
      if (editId) {
        await API.put('/api/exhibitions/' + editId, payload);
        showMsg('Exhibition updated.', 'success');
      } else {
        await API.post('/api/exhibitions', payload);
        showMsg('Exhibition created. Redirecting…', 'success');
        setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 900);
      }
    } catch (err) { showMsg(err.message, 'error'); }
  }
</script>
</body>
</html>
